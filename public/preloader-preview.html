<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuberis — Money Trace Preloader Interactive Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Alex+Brush&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #030812;
      color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Liquid Glass Backdrop Lighting */
    .ambient-mesh {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      animation: float 20s ease-in-out infinite alternate;
    }
    .orb-emerald {
      width: 550px;
      height: 550px;
      top: -150px;
      left: 10%;
      background: radial-gradient(circle, #10B981 0%, rgba(16, 185, 129, 0.3) 50%, transparent 75%);
    }
    .orb-gold {
      width: 480px;
      height: 480px;
      bottom: -100px;
      right: 15%;
      background: radial-gradient(circle, #F59E0B 0%, rgba(245, 158, 11, 0.25) 50%, transparent 75%);
      animation-delay: -7s;
    }
    .orb-cyan {
      width: 420px;
      height: 420px;
      top: 40%;
      right: 30%;
      background: radial-gradient(circle, #0284C7 0%, rgba(2, 132, 199, 0.2) 50%, transparent 75%);
      animation-delay: -12s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.12); }
    }

    /* Top Control Hub Bar */
    header {
      width: 100%;
      max-width: 1100px;
      padding: 24px 20px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      z-index: 10;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-poc {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34D399;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Interactive Controller Toolbar */
    .control-deck {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 6px 12px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.2);
      flex-wrap: wrap;
    }

    .btn {
      background: transparent;
      border: 1px solid transparent;
      color: #94A3B8;
      font-weight: 700;
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.08);
    }
    .btn.active {
      background: #10B981;
      color: #04101E;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }
    .btn-replay {
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
      color: #000;
      font-weight: 800;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.4);
    }
    .btn-replay:hover {
      background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
      transform: translateY(-1px);
    }

    /* Main Stage */
    main {
      width: 100%;
      max-width: 1100px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 5;
      padding: 20px;
    }

    .stage-card {
      width: 100%;
      height: 480px;
      border-radius: 28px;
      background: rgba(10, 25, 47, 0.65);
      backdrop-filter: blur(32px) saturate(190%);
      -webkit-backdrop-filter: blur(32px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.35), 0 30px 80px -20px rgba(0, 0, 0, 0.8), 0 0 40px rgba(16, 185, 129, 0.12);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* SVG Canvas Area */
    .svg-stage {
      width: 100%;
      max-width: 900px;
      height: 280px;
      position: relative;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Path Styles */
    .trace-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .trace-liquid {
      fill: none;
      stroke: url(#moneyGoldGradient);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 12px #F59E0B) drop-shadow(0 0 24px #10B981);
      transition: stroke-dashoffset 0.05s linear;
    }

    .revealed-text {
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      transform: scale(0.96);
      pointer-events: none;
    }
    .revealed-text.show {
      opacity: 1;
      transform: scale(1);
    }

    /* Traveling Gold Coin Entity */
    .traveling-entity {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
      will-change: transform;
      z-index: 100;
    }

    /* 3D Gold Coin Element */
    .coin-3d {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #FFFBEB 0%, #FBBF24 35%, #D97706 70%, #78350F 100%);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.8), inset 0 2px 3px rgba(255, 255, 255, 0.8), inset 0 -2px 3px rgba(0, 0, 0, 0.6);
      border: 2px solid #FDE68A;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #78350F;
      font-size: 22px;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.7);
      animation: coinSpin 1.4s linear infinite;
    }

    @keyframes coinSpin {
      0% { transform: scaleX(1) rotate(0deg); }
      25% { transform: scaleX(0.25) rotate(15deg); }
      50% { transform: scaleX(1) rotate(0deg); }
      75% { transform: scaleX(0.25) rotate(-15deg); }
      100% { transform: scaleX(1) rotate(0deg); }
    }

    /* Trailing Emerald Currency Notes */
    .note-entity {
      position: absolute;
      width: 46px;
      height: 24px;
      border-radius: 4px;
      background: linear-gradient(135deg, #059669 0%, #10B981 60%, #34D399 100%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px;
      font-size: 9px;
      font-weight: 900;
      color: #064E3B;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 95;
      animation: noteFlutter 1.2s ease-in-out infinite alternate;
    }

    .note-entity::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 35%;
      width: 2px;
      background: rgba(251, 191, 36, 0.8);
      box-shadow: 0 0 4px #FBBF24;
    }

    @keyframes noteFlutter {
      0% { transform: translate(-50%, -50%) rotate(-12deg) scale(0.95); }
      100% { transform: translate(-50%, -50%) rotate(18deg) scale(1.05); }
    }

    /* Sparks & Embers Canvas */
    #sparksCanvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 90;
    }

    /* Tagline & Status Subtitle */
    .status-hud {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      z-index: 10;
    }

    .tagline-pill {
      font-size: 13px;
      font-weight: 700;
      color: #38BDF8;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tagline-pill.show {
      opacity: 1;
      transform: translateY(0);
    }

    .state-info {
      font-size: 12px;
      color: #64748B;
      letter-spacing: 0.3px;
    }

    /* Bottom Info Card */
    footer {
      width: 100%;
      max-width: 1100px;
      padding: 16px 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
      color: #64748B;
      z-index: 10;
    }

    .preset-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Speed Slider Controls */
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #94A3B8;
      font-weight: 600;
    }

    input[type="range"] {
      accent-color: #10B981;
      cursor: pointer;
      width: 90px;
    }
  </style>
</head>

  <script>
    // State Variables
    let currentStyle = 'cursive';
    let animationDuration = 1500; // default 1.5s
    let animStartTime = null;
    let animFrameId = null;

    // Elements
    const leadCoin = document.getElementById('leadCoin');
    const trailNote1 = document.getElementById('trailNote1');
    const trailNote2 = document.getElementById('trailNote2');
    const taglinePill = document.getElementById('taglinePill');
    const stateLabel = document.getElementById('stateLabel');
    const mainSvg = document.getElementById('mainSvg');

    // Canvas Particles
    const canvas = document.getElementById('sparksCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnSparks(x, y) {
      for (let i = 0; i < 4; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1.5;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1,
          size: Math.random() * 3 + 1.5,
          color: Math.random() > 0.4 ? '#FBBF24' : '#10B981',
          alpha: 1,
          life: 0.95
        });
      }
    }

    function updateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha *= p.life;
        p.size *= 0.97;

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (p.alpha < 0.05) {
          particles.splice(i, 1);
        }
      }
    }

    // Animation Driver
    function getActiveElements() {
      if (currentStyle === 'cursive') {
        return {
          path: document.getElementById('liquidCursive'),
          text: document.getElementById('textCursive'),
          group: document.getElementById('groupCursive')
        };
      } else if (currentStyle === 'modern') {
        return {
          path: document.getElementById('liquidModern'),
          text: document.getElementById('textModern'),
          group: document.getElementById('groupModern')
        };
      } else {
        return {
          path: document.getElementById('liquidSerif'),
          text: document.getElementById('textSerif'),
          group: document.getElementById('groupSerif')
        };
      }
    }

    function resetCurrentAnimation() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      particles = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ['cursive', 'modern', 'serif'].forEach(st => {
        const key = st.charAt(0).toUpperCase() + st.slice(1);
        const p = document.getElementById(`liquid${key}`);
        const t = document.getElementById(`text${key}`);
        if (p) {
          const len = p.getTotalLength();
          p.style.strokeDasharray = len;
          p.style.strokeDashoffset = len;
        }
        if (t) {
          t.classList.remove('show');
        }
      });

      leadCoin.style.display = 'flex';
      trailNote1.style.display = 'flex';
      trailNote2.style.display = 'flex';
      taglinePill.classList.remove('show');
      stateLabel.textContent = "Money is tracing the name across the canvas...";
      stateLabel.style.color = "#64748B";
    }

    function animate(timestamp) {
      if (!animStartTime) animStartTime = timestamp;
      const elapsed = timestamp - animStartTime;
      const progress = Math.min(1, elapsed / animationDuration);

      // Smooth Easing (cubic easeInOut)
      const ease = progress < 0.5
        ? 4 * progress * progress * progress
        : 1 - Math.pow(-2 * progress + 2, 3) / 2;

      const { path, text } = getActiveElements();
      const totalLen = path.getTotalLength();
      const currentDist = ease * totalLen;

      // Update stroke dashoffset
      path.style.strokeDashoffset = totalLen - currentDist;

      // Calculate SVG Coordinates -> Screen Coordinates for Coin & Notes
      const svgRect = mainSvg.getBoundingClientRect();
      const cardRect = document.querySelector('.stage-card').getBoundingClientRect();
      const scaleX = svgRect.width / 900;
      const scaleY = svgRect.height / 240;

      // Lead Coin Position
      const ptLead = path.getPointAtLength(currentDist);
      const coinScreenX = (svgRect.left - cardRect.left) + ptLead.x * scaleX;
      const coinScreenY = (svgRect.top - cardRect.top) + ptLead.y * scaleY;
      leadCoin.style.transform = `translate(${coinScreenX}px, ${coinScreenY}px)`;

      // Spawn Sparks at Coin tip
      spawnSparks(coinScreenX, coinScreenY);

      // Trail Note 1 Position (~35px behind)
      const note1Dist = Math.max(0, currentDist - 40);
      const ptNote1 = path.getPointAtLength(note1Dist);
      const note1ScreenX = (svgRect.left - cardRect.left) + ptNote1.x * scaleX;
      const note1ScreenY = (svgRect.top - cardRect.top) + ptNote1.y * scaleY;
      trailNote1.style.transform = `translate(${note1ScreenX}px, ${note1ScreenY}px)`;

      // Trail Note 2 Position (~75px behind)
      const note2Dist = Math.max(0, currentDist - 75);
      const ptNote2 = path.getPointAtLength(note2Dist);
      const note2ScreenX = (svgRect.left - cardRect.left) + ptNote2.x * scaleX;
      const note2ScreenY = (svgRect.top - cardRect.top) + ptNote2.y * scaleY;
      trailNote2.style.transform = `translate(${note2ScreenX}px, ${note2ScreenY}px)`;

      // Render Particles
      updateParticles();

      if (progress < 1) {
        animFrameId = requestAnimationFrame(animate);
      } else {
        // Animation Complete: "The Grand Reveal"
        onTraceComplete(text);
      }
    }

    function onTraceComplete(textEl) {
      // Reveal Solid Illuminated Typography
      textEl.classList.add('show');
      taglinePill.classList.add('show');
      stateLabel.textContent = "✨ Name Revealed: Illuminated Liquid Gold & Emerald Glass";
      stateLabel.style.color = "#34D399";

      // Gold Coin burst effect at the final letter
      for (let i = 0; i < 40; i++) {
        const rect = leadCoin.getBoundingClientRect();
        const cardRect = document.querySelector('.stage-card').getBoundingClientRect();
        spawnSparks(rect.left - cardRect.left + 22, rect.top - cardRect.top + 22);
      }

      // Fade out trailing notes gently into ambient mesh
      setTimeout(() => {
        leadCoin.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
        trailNote1.style.transition = 'opacity 0.6s ease';
        trailNote2.style.transition = 'opacity 0.6s ease';
        leadCoin.style.opacity = '0';
        trailNote1.style.opacity = '0';
        trailNote2.style.opacity = '0';
      }, 300);
    }

    function replayAnimation() {
      resetCurrentAnimation();
      leadCoin.style.opacity = '1';
      trailNote1.style.opacity = '1';
      trailNote2.style.opacity = '1';
      leadCoin.style.transition = 'none';
      trailNote1.style.transition = 'none';
      trailNote2.style.transition = 'none';

      animStartTime = null;
      animFrameId = requestAnimationFrame(animate);
    }

    function switchStyle(styleName) {
      currentStyle = styleName;

      // Update Buttons
      document.getElementById('btnCursive').classList.toggle('active', styleName === 'cursive');
      document.getElementById('btnModern').classList.toggle('active', styleName === 'modern');
      document.getElementById('btnSerif').classList.toggle('active', styleName === 'serif');

      // Toggle SVG Groups
      document.getElementById('groupCursive').style.display = styleName === 'cursive' ? 'block' : 'none';
      document.getElementById('groupModern').style.display = styleName === 'modern' ? 'block' : 'none';
      document.getElementById('groupSerif').style.display = styleName === 'serif' ? 'block' : 'none';

      replayAnimation();
    }

    function updateDuration() {
      const val = parseFloat(document.getElementById('speedSlider').value);
      animationDuration = val * 1000;
      document.getElementById('speedLabel').textContent = `${val}s`;
      replayAnimation();
    }

    // Auto-start on load
    window.addEventListener('load', () => {
      resizeCanvas();
      setTimeout(replayAnimation, 200);
    });
  </script>
</body>
</html>
